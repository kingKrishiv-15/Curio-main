# Supabase CLI project config. Used for local development (`supabase start`)
# and by CI to spin up an ephemeral local stack to apply migrations and run
# the database tests in supabase/tests/. Not used for the real dev/staging/
# prod projects - those are configured by `supabase link` per environment,
# which reads project ref + credentials from the CLI's own login state /
# environment variables, never from this file.
project_id = "curio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
