name: App
on:
  push:
    branches: [main, krishiv-2, vaibhav]
  pull_request:
  workflow_dispatch:

jobs:
  report-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test supabase/functions/_shared/reports.test.ts

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tool/build_supabase_setup.py --check
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --dart-define=CURIO_DEMO=true
